<!doctype html><html lang="el"><meta charset="utf-8"><title>V5 offline tracking probe</title><body><p>Isolated detector experiment. No classifier, recording, or shipped application.</p><script type="module">
window.v5TrackingRun=(data)=>new Promise((resolve,reject)=>{const worker=new Worker(new URL('./src/v5_tracking.worker.ts',import.meta.url),{type:'module'});const timer=setTimeout(()=>{worker.terminate();reject(new Error('120 second timeout'));},120000);worker.onmessage=({data})=>{clearTimeout(timer);worker.terminate();data.error?reject(new Error(data.error)):resolve(data);};worker.onerror=e=>{clearTimeout(timer);worker.terminate();reject(new Error(e.message));};worker.postMessage(data);});
</script></body></html>
