<!doctype html><html lang="el"><meta charset="utf-8"><title>V6 dedicated hand research</title><body><p>Isolated hand recovery experiment; no classifier or public app.</p><script type="module">
window.v6HandRecovery=(data)=>new Promise((resolve,reject)=>{const worker=new Worker(new URL('./src/v6_hand_recovery.worker.ts',import.meta.url),{type:'module'});const timer=setTimeout(()=>{worker.terminate();reject(new Error('Timeout'));},120000);worker.onmessage=({data})=>{clearTimeout(timer);worker.terminate();data.error?reject(new Error(data.error)):resolve(data);};worker.onerror=e=>{clearTimeout(timer);worker.terminate();reject(new Error(e.message));};worker.postMessage(data);});
</script></body></html>
